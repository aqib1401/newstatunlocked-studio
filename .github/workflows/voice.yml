name: ElevenLabs voice
on:
  push:
    paths: ["episodes/**/voice_request.json"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: voice, cancel-in-progress: false }
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate voiceovers
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 tools/elevenlabs_voice.py
      - name: Commit results
        run: |
          git config user.name "nsu-voice-bot"
          git config user.email "voice-bot@users.noreply.github.com"
          git add episodes
          git diff --cached --quiet && exit 0
          git commit -m "Voiceover from ElevenLabs"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
